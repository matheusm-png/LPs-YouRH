<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Obrigado! — YouEduca</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #2A0062 0%, #3D008C 50%, #1A004A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(0,200,83,0.15);
      border: 2px solid rgba(0,200,83,0.35);
      color: #00C853;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon svg { width: 36px; height: 36px; }
    h1 {
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    p {
      font-size: 1.0625rem;
      color: rgba(255,255,255,0.75);
      line-height: 1.6;
      margin-bottom: 0.75rem;
    }
    .highlight { color: #00C853; font-weight: 600; }
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.10);
      margin: 2rem 0;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.60);
      font-size: 0.875rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #00C853; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 36 36" fill="none">
        <path d="M8 18l7 7 13-13" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Recebemos sua solicitação!</h1>

    <p>
      Um especialista <span class="highlight">YouEduca</span> vai entrar em contato
      em breve — geralmente <span class="highlight">em até 1 dia útil</span>.
    </p>

    <p>
      Fique de olho no seu e-mail. Enquanto isso, que tal conhecer
      mais sobre a plataforma?
    </p>

    <hr class="divider" />

    <a href="index.html" class="back-link">
      ← Voltar para a página YouEduca
    </a>
  </div>

</body>
</html>
